org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 opt-outs. Flutter's migrator re-adds both as `false` on every build if
# the key is missing, so flip them to `true` here when the blockers below are gone.
# builtInKotlin: home_widget 0.7.x, share_plus 12.x and shared_preferences_android 2.4.x
# still `apply plugin: 'kotlin-android'`, which fails under AGP's built-in Kotlin.
android.builtInKotlin=false
# newDsl: most plugins (firebase_*, geolocator, home_widget, share_plus, ...) still use
# the legacy DSL (`lintOptions`, `kotlinOptions`, `compileSdkVersion`, `project.android.hasProperty`).
android.newDsl=false
